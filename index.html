<style>
/* Layout: one narrow reading column; benchmarks as a ruled index of rows that open in place. */
:root {

  --second: #1C8C7C;

  --text: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161B; --ink: #E8E9E4; --muted: #9A9EA8; --rule: #2A2D35;
    --accent: #93A4FF; --accent-soft: #3A4474; --accent-mid: #5B6CC4; --second: #4CC4B0; --track: #22252C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161B; --ink: #E8E9E4; --muted: #9A9EA8; --rule: #2A2D35;
  --accent: #93A4FF; --accent-soft: #3A4474; --accent-mid: #5B6CC4; --second: #4CC4B0; --track: #22252C; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font: 400 16px/1.6 var(--text);
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(48px, 9vw, 112px) 64px;
}
a { color: inherit; text-decoration-color: var(--accent-soft); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

header { display: grid; gap: 20px; margin-bottom: clamp(40px, 7vw, 72px); }
h1 {
  font: 500 clamp(34px, 6.4vw, 58px)/1.06 var(--display);
  letter-spacing: -0.02em; margin: 0; text-wrap: balance;

}
.lede { font-size: 18px; color: var(--muted); max-width: 60ch; margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 14px; color: var(--muted); margin: 4px 0 0; padding: 0; list-style: none; }
.facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.list { border-top: 1px solid var(--ink); }
details { border-bottom: 1px solid var(--rule); }
summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 28px;

}
summary::-webkit-details-marker { display: none; }
.cat { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.t { min-width: 0; }

.t p { margin: 0; color: var(--muted); font-size: 15px; max-width: 58ch; }
.score { text-align: right; align-self: start; min-width: 0; }
.score .v {

  color: var(--accent); white-space: nowrap; display: block;
}
.score .m { font-size: 12.5px; color: var(--muted); display: block; margin-top: 6px; max-width: 18ch; margin-left: auto; line-height: 1.35; }
.score .l { font-size: 14px; font-weight: 500; display: block; margin-top: 2px; }
.toggle {
  grid-column: 1 / -1; font-size: 13.5px; color: var(--accent); font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.toggle::after { content: "+"; font-size: 16px; line-height: 1; transition: transform .2s; }
details[open] .toggle::after { transform: rotate(45deg); }
details[open] .toggle .o { display: none; }
details:not([open]) .toggle .c { display: none; }
summary:hover h2 { color: var(--accent); }

.body { padding: 0 0 36px; display: grid; gap: 32px; }
.summary { font-size: 16.5px; max-width: 62ch; margin: 0; }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px 28px; margin: 0; }
.facts-grid dt { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.facts-grid dd { margin: 0; font-size: 15px; }
.note { font-size: 14.5px; color: var(--muted); border-left: 2px solid var(--accent-soft); padding-left: 14px; margin: 0; max-width: 62ch; }

.chart h3 { font: 600 14px/1.4 var(--text); margin: 0 0 12px; }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 4.2em; gap: 12px; align-items: center; font-size: 14px; }
.bar .n { overflow-wrap: anywhere; line-height: 1.3; }
.bar .tr { display: block; height: 12px; background: var(--track); border-radius: 6px; overflow: hidden; }
.bar .fl { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.bar.lead .n { font-weight: 600; }
.bar:not(.lead) .fl { background: var(--accent-mid); }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar.lead .val { color: var(--ink); font-weight: 600; }
.cmp { display: grid; gap: 12px; }
.cmp-row { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr); gap: 12px; align-items: center; font-size: 14px; }
.cmp-bars { display: grid; gap: 4px; }
.cmp-bars .bar { grid-template-columns: minmax(0, 1fr) 4.2em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 8px; border-radius: 3px; display: inline-block; }
.s0 { background: var(--accent) !important; }
.s1 { background: var(--second) !important; }
.cap { font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 62ch; }
.charts { display: grid; gap: 30px; }

.pub { font-size: 14.5px; margin: 0; max-width: 66ch; }
.pub + .pub { margin-top: 10px; }
.pub a { color: var(--accent); white-space: nowrap; }

section.pubs { margin-top: clamp(56px, 9vw, 96px); }
section.pubs h2 { font: 500 28px/1.2 var(--display); margin: 0 0 24px; letter-spacing: -0.01em; }
.publist { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; counter-reset: p; }
.publist li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); font-size: 15px; }
.publist li::before { counter-increment: p; content: counter(p); color: var(--muted); font-variant-numeric: tabular-nums; }
.publist .yr { color: var(--muted); }

footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--muted); }

@media (max-width: 560px) {
  summary { grid-template-columns: 1fr; }
  .score { text-align: left; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }

  .score .m, .score .l { margin: 0; max-width: none; }
  .bar, .cmp-row { grid-template-columns: minmax(0, 1fr) 4em; }
  .bar .n, .cmp-row > .n { grid-column: 1 / -1; }
  .bar .tr { grid-column: 1; }
  .cmp-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, f) => {
  const ru = n => n.replace(".", ",");
  if (f === "p") return ru(v.toFixed(1)) + "%";
  if (f === "p0") return Math.round(v) + "%";
  if (f === "f3") return ru(v.toFixed(3));
  return ru(v.toFixed(2));
};
const w = (v, max) => Math.max(1.5, v / max * 100).toFixed(1) + "%";

function chart(c) {
  let html = `<div class="chart"><h3>${esc(c.title)}</h3>`;
  if (c.type === "bar") {
    const top = Math.max(...c.items.filter((_, i) => !(c.ref && i === 0)).map(x => x[1]));
    html += `<div class="bars">` + c.items.map(([n, v], i) => {
      const lead = v === top && !(c.ref && i === 0);
      const style = c.ref && i === 0 ? ' style="background:var(--muted);opacity:.5"' : "";
      return `<div class="bar${lead ? " lead" : ""}"><span class="n">${esc(n)}</span><span class="tr"><span class="fl" style="width:${w(v, c.max)}"></span></span><span class="val">${fmt(v, c.fmt)}</span></div>`.replace('class="fl"', `class="fl"${style}`);
    }).join("") + `</div>`;
  } else {
    html += `<div class="legend">${c.series.map((s, i) => `<span><i class="s${i}"></i>${esc(s)}</span>`).join("")}</div><div class="cmp">` +
      c.items.map(([n, a, b]) => `<div class="cmp-row"><span class="n">${esc(n)}</span><div class="cmp-bars">${[a, b].map((v, i) =>
        `<div class="bar"><span class="tr"><span class="fl s${i}" style="width:${w(v, c.max)}"></span></span><span class="val">${fmt(v, c.fmt)}</span></div>`).join("")}</div></div>`).join("") + `</div>`;
  }
  if (c.cap) html += `<p class="cap">${esc(c.cap)}</p>`;
  return html + `</div>`;
}

function pub(p) {
  return `<p class="pub">${esc(p.c)}${p.u ? ` <a href="${esc(p.u)}" target="_blank" rel="noopener">Читать статью</a>` : ""}</p>`;
}

document.getElementById("list").innerHTML = B.map(b => `
<details id="${b.id}">
  <summary>
    <span class="cat">${esc(b.cat)}</span>
    <div class="t"><h2>${esc(b.title)}</h2><p>${esc(b.short)}</p></div>
    <div class="score"><span class="v">${esc(b.value)}</span><span class="l">${esc(b.leader)}</span><span class="m">${esc(b.metric)}</span></div>
    <span class="toggle"><span class="o">Лидерборд и статья</span><span class="c">Свернуть</span></span>
  </summary>
  <div class="body">
    <p class="summary">${esc(b.summary)}</p>
    <dl class="facts-grid">${b.details.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    <div class="charts">${b.charts.map(chart).join("")}</div>
    <p class="note">${esc(b.note)}</p>
    <div>${b.pubs.map(pub).join("")}</div>
  </div>
</details>`).join("");

const allPubs = B.flatMap(b => b.pubs.map(p => ({...p, t: b.title, id: b.id}))).sort((a, b) => b.y - a.y);
document.getElementById("publist").innerHTML = allPubs.map(p =>
  `<li><div>${esc(p.c)} <span class="yr">— <a href="#${p.id}">${esc(p.t)}</a></span>${p.u ? ` <a href="${esc(p.u)}" target="_blank" rel="noopener" style="color:var(--accent)">PDF</a>` : ""}</div></li>`).join("");

document.getElementById("facts").innerHTML =
  `<li><b>${B.length}</b> бенчмарков</li><li><b>${allPubs.length}</b> публикаций</li><li><b>2025–2026</b></li>`;

function openHash() {
  const id = location.hash.slice(1);
  const el = id && document.getElementById(id);
  if (el && el.tagName === "DETAILS") { el.open = true; el.scrollIntoView({block: "start"}); }
}
window.addEventListener("hashchange", openHash);
openHash();
